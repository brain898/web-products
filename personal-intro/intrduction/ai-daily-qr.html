<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码加入 AI 日报群 — 叶文哲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1A1A1C;--bg-card:#222226;--border:#2D2D30;--text:#FAFAFA;--text-mute:#A0A0A8;--text-soft:#6A6A72;--accent:#E8B86D}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans SC',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}

.back{position:fixed;top:32px;left:32px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-soft);text-decoration:none;transition:color 0.2s;font-weight:400}
.back:hover{color:var(--text)}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:28px;padding:48px 40px;max-width:400px;width:100%;text-align:center;opacity:0;animation:fadeUp 0.6s ease forwards 0.1s}

.card .label{font-family:'Inter',sans-serif;font-size:12px;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:20px;font-weight:500}
.card h1{font-family:'Noto Sans SC',sans-serif;font-size:22px;font-weight:500;letter-spacing:-0.01em;line-height:1.4;margin-bottom:8px}
.card .desc{font-family:'Noto Sans SC',sans-serif;font-size:14px;color:var(--text-mute);line-height:1.7;font-weight:300;margin-bottom:32px}

.qr-wrap{background:#fff;border-radius:16px;padding:20px;display:inline-block;margin-bottom:32px}
.qr-wrap img{width:200px;height:auto;display:block}

.card .hint{font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--text-soft);line-height:1.6;font-weight:300}
.card .hint strong{color:var(--text-mute);font-weight:500}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:480px){
  .card{padding:36px 28px}
  .qr-wrap{padding:16px}
  .qr-wrap img{width:180px;height:auto}
}
</style>
</head>
<body>

<a class="back" href="works.html">&larr; 返回作品集</a>

<div class="card">
  <div class="label">Daily AI News</div>
  <h1>扫码加入 AI 日报群</h1>
  <p class="desc">每天早上自动推送 AI 领域最新动态，不用刷 Twitter 也能掌握前沿进展。</p>
  <div class="qr-wrap">
    <img src="logos/ai-daily-qr.jpg" alt="AI 日报群二维码">
  </div>
  <p class="hint"><strong>长按或扫码</strong> 加群，每天接收 AI 日报</p>
</div>

</body>
</html>
