<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0820;
  --card:rgba(20,16,48,0.55);
  --card-hover:rgba(30,22,68,0.78);
  --border:rgba(168,150,220,0.16);
  --border-hover:rgba(255,144,160,0.4);
  --text:var(--kimi-text,#f4eef9);
  --text-mute:rgba(220,210,240,0.65);
  --text-soft:rgba(180,170,210,0.5);
  --accent:var(--kimi-accent,#ffb098);
  --thread:var(--kimi-thread,#ff8a7a);
  --tag-cn:rgba(255,176,152,0.16);
  --tag-cn-text:#ffd0bc;
  --tag-en:rgba(168,144,255,0.16);
  --tag-en-text:#c8b8ff;
}
html,body{background:var(--bg)}
body{color:var(--text);font-family:'Inter','Noto Sans SC',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:1320px;margin:0 auto;padding:0 40px;position:relative;z-index:2}

nav{padding:32px 0;display:flex;justify-content:space-between;align-items:center}
nav .logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-style:italic;font-weight:400;letter-spacing:0.02em;color:var(--text);text-decoration:none;transition:color 0.3s}
nav .logo:hover{color:var(--accent)}
nav .menu{display:flex;gap:36px;font-size:13px}
nav .menu a{color:var(--text-mute);text-decoration:none;transition:color 0.3s;font-weight:300;letter-spacing:0.02em;position:relative;padding-bottom:2px}
nav .menu a.active{color:var(--accent)}
nav .menu a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform 0.4s cubic-bezier(0.16,1,0.3,1)}
nav .menu a:hover{color:var(--text)}
nav .menu a:hover::after,nav .menu a.active::after{transform:scaleX(1);transform-origin:left}

/* Hero */
.hero{padding:80px 0 48px;position:relative}
.hero .label{font-family:'Inter',sans-serif;font-size:11px;color:var(--text-soft);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:20px;font-weight:400;opacity:0;animation:fadeUp 0.8s ease forwards 0.1s}
.hero .label::before{content:"";display:inline-block;width:24px;height:1px;background:var(--accent);vertical-align:middle;margin-right:12px;opacity:0.7}
.hero .jp-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--accent);letter-spacing:0.05em;margin-bottom:8px;opacity:0;animation:fadeUp 0.8s ease forwards 0.2s;font-weight:300}
.hero h1{font-family:'Noto Serif SC',serif;font-size:clamp(48px,7vw,96px);font-weight:300;letter-spacing:0.02em;line-height:1.05;margin-bottom:24px;opacity:0;animation:fadeUp 0.9s ease forwards 0.28s}
.hero h1 .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:0.42em;color:var(--text-mute);display:block;margin-top:14px;letter-spacing:0.05em}
.hero .lede{font-family:'Noto Sans SC',sans-serif;font-size:15px;color:var(--text-mute);max-width:720px;line-height:1.95;font-weight:300;opacity:0;animation:fadeUp 0.8s ease forwards 0.4s}
.hero .meta{display:flex;gap:24px;align-items:center;margin-top:32px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--text-soft);letter-spacing:0.05em;opacity:0;animation:fadeUp 0.8s ease forwards 0.5s;flex-wrap:wrap}
.hero .meta .dot-sep{width:3px;height:3px;background:var(--text-soft);border-radius:50%;display:inline-block}
.hero .meta .src{font-family:'Inter',sans-serif;font-style:normal;font-size:11px;letter-spacing:0.2em;text-transform:uppercase}

/* Filter bar */
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:32px;flex-wrap:wrap;gap:16px;opacity:0;animation:fadeUp 0.8s ease forwards 0.6s}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:24px;background:transparent;border:1px solid var(--border);color:var(--text-mute);font-family:'Noto Sans SC',sans-serif;font-size:12px;font-weight:300;cursor:pointer;transition:all 0.3s;letter-spacing:0.02em}
.tab:hover{border-color:var(--border-hover);color:var(--text)}
.tab.active{background:rgba(255,160,180,0.14);border-color:rgba(255,160,180,0.45);color:var(--accent)}
.tab .count{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;margin-left:6px;opacity:0.7}
.region-toggle{display:flex;gap:4px;background:rgba(20,16,48,0.5);border:1px solid var(--border);border-radius:24px;padding:3px}
.region-toggle button{padding:6px 14px;border-radius:20px;background:none;border:none;color:var(--text-mute);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0.05em;cursor:pointer;transition:all 0.3s;font-weight:400}
.region-toggle button.active{background:rgba(255,160,180,0.18);color:var(--accent)}

/* Categories */
.category{margin-bottom:64px;opacity:0;animation:fadeUp 0.7s ease forwards}
.category:nth-of-type(1){animation-delay:0.7s}
.category:nth-of-type(2){animation-delay:0.78s}
.category:nth-of-type(3){animation-delay:0.86s}
.category:nth-of-type(4){animation-delay:0.94s}
.category:nth-of-type(5){animation-delay:1.02s}
.category:nth-of-type(6){animation-delay:1.10s}
.category-head{display:flex;align-items:baseline;gap:18px;margin-bottom:28px}
.category-head .num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--accent);letter-spacing:0.1em}
.category-head .name{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:400;color:var(--text);letter-spacing:0.04em}
.category-head .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--text-soft);letter-spacing:0.05em;font-weight:300}
.category-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);align-self:center}

.scenarios{display:flex;flex-direction:column;gap:24px}
.scenario{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:start}
.scene-label{padding-top:6px}
.scene-label .scene-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:400;color:var(--text);margin-bottom:6px;letter-spacing:0.02em}
.scene-label .scene-en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--text-soft);letter-spacing:0.05em}
.scene-label .scene-marker{width:24px;height:1px;background:var(--accent);opacity:0.6;margin:10px 0}
.scene-label .scene-note{font-family:'Noto Sans SC',sans-serif;font-size:11px;color:var(--text-soft);line-height:1.7;margin-top:10px;font-weight:300;font-style:italic}

.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.product{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:18px 20px 16px;text-decoration:none;color:var(--text);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:118px}
.product::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform 0.4s cubic-bezier(0.16,1,0.3,1)}
.product:hover{background:var(--card-hover);border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 16px 40px -16px rgba(0,0,0,0.5),0 0 30px -10px var(--thread)}
.product:hover::before{transform:scaleY(1);transform-origin:top}
.product-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.product-head{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.product-name{font-family:'Inter','Noto Sans SC',sans-serif;font-size:15px;font-weight:500;color:var(--text);letter-spacing:0.01em;line-height:1.3}
.tag{flex-shrink:0;padding:2px 9px;border-radius:10px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase}
.tag.cn{background:var(--tag-cn);color:var(--tag-cn-text)}
.tag.en{background:var(--tag-en);color:var(--tag-en-text)}
.product-highlight{font-family:'Noto Sans SC',sans-serif;font-size:12.5px;color:var(--text-mute);line-height:1.7;font-weight:300;flex:1}
.product-link{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-soft);letter-spacing:0.04em;display:flex;justify-content:space-between;align-items:center;opacity:0;transition:opacity 0.3s}
.product:hover .product-link{opacity:1}
.product-link .arrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--accent)}

/* Brand Logos */
.brand-logo{width:28px;height:28px;border-radius:7px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06)}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-logo-fallback{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text-mute)}

/* Empty state */
.empty{text-align:center;padding:80px 20px;color:var(--text-soft);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px}

footer{padding:40px 0 56px;border-top:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--text-soft);display:flex;justify-content:space-between;letter-spacing:0.05em;margin-top:60px}
footer a{color:inherit;text-decoration:none;transition:color 0.3s}
footer a:hover{color:var(--accent)}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){
  .scenario{grid-template-columns:1fr;gap:14px}
  .scene-label .scene-marker{display:none}
}
@media(max-width:768px){
  .hero{padding:48px 0 32px}
  .hero h1{font-size:48px}
  nav .menu{gap:18px;font-size:12px}
  .container{padding:0 22px}
  .products{grid-template-columns:1fr}
  .toolbar{flex-direction:column;align-items:flex-start}
}
</style>

<script>
(async function(){
  var data;
  try{
    data = JSON.parse(document.getElementById('toolbox-data').textContent);
  }catch(e){
    document.getElementById('main').innerHTML='<div class="empty">— 工具箱数据加载失败 —</div>';
    return;
  }
  var lu=document.getElementById('last-updated');
  if(lu)lu.textContent=data.lastUpdated||'—';

  var state = { cat: 'all', region: 'all' };

  // Build tabs
  var tabs = document.getElementById('tabs');
  function totalCount(){
    var n=0;
    data.categories.forEach(function(c){
      c.scenarios.forEach(function(s){ s.products.forEach(function(p){
        if(state.region==='all'||p.tag===state.region) n++;
      })});
    });
    return n;
  }
  function catCount(cat){
    var n=0;
    cat.scenarios.forEach(function(s){ s.products.forEach(function(p){
      if(state.region==='all'||p.tag===state.region) n++;
    })});
    return n;
  }

  function renderTabs(){
    var html='<button class="tab '+(state.cat==='all'?'active':'')+'" data-cat="all">全部 <span class="count">'+totalCount()+'</span></button>';
    data.categories.forEach(function(c){
      html+='<button class="tab '+(state.cat===c.id?'active':'')+'" data-cat="'+c.id+'">'+c.name+' <span class="count">'+catCount(c)+'</span></button>';
    });
    tabs.innerHTML=html;
    tabs.querySelectorAll('.tab').forEach(function(b){
      b.addEventListener('click',function(){ state.cat=b.dataset.cat; render(); });
    });
  }

  document.getElementById('region').addEventListener('click',function(e){
    var b=e.target.closest('button[data-region]');if(!b)return;
    state.region=b.dataset.region;
    document.querySelectorAll('#region button').forEach(function(x){x.classList.toggle('active',x===b)});
    render();
  });

  function tagClass(t){ return t==='国内'?'cn':'en'; }
  function tagText(t){ return t==='国内'?'CN':'GLOBAL'; }

  // English category names for sub-headers
  var EN_CAT = {
    knowledge: 'Knowledge & Research',
    content: 'Content & Writing',
    code: 'Code & Engineering',
    visual: 'Visual & Design',
    multimedia: 'Multimedia',
    tools: 'Hardware & Input',
    agent: 'Agent Platforms',
    efficiency: 'Productivity'
  };
  var EN_SCENE = {
    'AI 搜索引擎':'Search','知识问答':'Q&A','深度研究':'Deep Research','AI 资讯获取':'AI News','实时信息获取':'Realtime',
    '内容创作与知识管理':'Writing','AI 翻译':'Translate','知识库管理':'Knowledge Base','AI 数字人':'Avatar',
    '数据分析':'Data','架构规划':'Architecture','代码开发执行':'Coding','AI 代码编辑器':'IDE',
    '前端设计':'Frontend','图片与平面设计':'Image','AI 设计平台':'Design','AI 演示文稿':'Slides',
    '视频生成':'Video','音乐生成':'Music','3D 生成':'3D',
    'AI 输入法':'Input','AI 硬件':'Hardware',
    'AI Agent 构建':'Agent Builder',
    'AI 工作空间':'Workspace','工作流自动化':'Automation'
  };

  function renderCategory(cat, idx){
    var visibleScenarios = cat.scenarios.map(function(s){
      var ps = s.products.filter(function(p){ return state.region==='all'||p.tag===state.region; });
      return { scene:s.scene, note:s.note, products:ps };
    }).filter(function(s){ return s.products.length>0; });
    if(visibleScenarios.length===0) return '';

    var num = String(idx+1).padStart(2,'0');
    var html = '<section class="category" data-cat="'+cat.id+'">';
    html += '<div class="category-head"><span class="num">'+num+' —</span><span class="name">'+cat.name+'</span><span class="en">'+(EN_CAT[cat.id]||'')+'</span><span class="line"></span></div>';
    html += '<div class="scenarios">';
    visibleScenarios.forEach(function(s){
      html += '<div class="scenario">';
      html += '<div class="scene-label"><div class="scene-name">'+s.scene+'</div><div class="scene-en">'+(EN_SCENE[s.scene]||'')+'</div><div class="scene-marker"></div>';
      if(s.note) html += '<div class="scene-note">'+s.note+'</div>';
      html += '</div>';
      html += '<div class="products">';
      s.products.forEach(function(p){
        var domain = '';
        try{ domain = new URL(p.url).host.replace(/^www\./,''); }catch(_){}
        html += '<a class="product" href="'+p.url+'" target="_blank" rel="noopener">';
        html += '<div class="product-top">'+buildLogo(p.name)+'<div class="product-head"><div class="product-name">'+p.name+'</div><span class="tag '+tagClass(p.tag)+'">'+tagText(p.tag)+'</span></div></div>';
        html += '<div class="product-highlight">'+p.highlight+'</div>';
        html += '<div class="product-link"><span>'+domain+'</span><span class="arrow">→</span></div>';
        html += '</a>';
      });
      html += '</div></div>';
    });
    html += '</div></section>';
    return html;
  }

  function render(){
    renderTabs();
    var main = document.getElementById('main');
    var cats = state.cat==='all' ? data.categories : data.categories.filter(function(c){return c.id===state.cat});
    var html = '';
    cats.forEach(function(c, i){
      var idx = state.cat==='all' ? i : data.categories.findIndex(function(x){return x.id===c.id});
      html += renderCategory(c, idx);
    });
    if(!html.trim()) html = '<div class="empty">— 当前筛选下没有工具 —</div>';
    main.innerHTML = html;
  }

  render();
})();

// Tweaks panel — shared
(function(){
  var TWEAKS=/*EDITMODE-BEGIN*/{"palette":"twilight"}/*EDITMODE-END*/;
})();
function buildPanel(){
  if(document.getElementById('kimi-tweaks'))return;
  var p=document.createElement('div');p.id='kimi-tweaks';
  p.style.cssText='position:fixed;right:20px;bottom:20px;z-index:1000;background:rgba(15,12,40,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,160,180,0.25);border-radius:16px;padding:20px 22px;font-family:Inter,sans-serif;font-size:12px;color:#f4eef9;min-width:240px;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:none';
  var current=window.__KIMI_PALETTE__||'twilight';
  function opt(v,label,grad,cur){var sel=v===cur;return '<button data-pal="'+v+'" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid '+(sel?'rgba(255,160,180,0.5)':'rgba(255,255,255,0.08)')+';background:'+(sel?'rgba(255,160,180,0.1)':'transparent')+';cursor:pointer;color:#f4eef9;font-family:inherit;font-size:12px;text-align:left;transition:all 0.2s"><span style="width:32px;height:20px;border-radius:5px;background:'+grad+';border:1px solid rgba(255,255,255,0.15);flex-shrink:0"></span><span>'+label+'</span></button>';}
  p.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:15px;color:#ffb098">Tweaks</span><button id="kimi-close" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px;line-height:1">×</button></div>'
    +'<div style="font-size:10px;letter-spacing:0.2em;color:rgba(220,210,240,0.5);text-transform:uppercase;margin-bottom:10px">Palette · 色调</div>'
    +'<div style="display:flex;flex-direction:column;gap:8px">'
    +opt('twilight','深夜紫蓝 Twilight','linear-gradient(135deg,#0a0820,#43286a,#a85d8c)',current)
    +opt('comet','彗星冷蓝 Comet','linear-gradient(135deg,#050818,#2c4380,#aab8e8)',current)
    +opt('shrine','黄昏暖橙 Shrine','linear-gradient(135deg,#3a1338,#a04a5a,#f0b878)',current)
    +'</div>';
  document.body.appendChild(p);
  p.addEventListener('click',function(e){var b=e.target.closest('[data-pal]');if(!b)return;var v=b.getAttribute('data-pal');try{window.parent.postMessage({type:'__edit_mode_set_keys',edits:{palette:v}},'*')}catch(_){}localStorage.setItem('kimiPalette',v);location.reload();});
  document.getElementById('kimi-close').onclick=function(){p.style.display='none';try{window.parent.postMessage({type:'__edit_mode_dismissed'},'*')}catch(_){}};
}
window.addEventListener('message',function(e){if(!e.data||!e.data.type)return;if(e.data.type==='__activate_edit_mode'){buildPanel();document.getElementById('kimi-tweaks').style.display='block'}if(e.data.type==='__deactivate_edit_mode'){var el=document.getElementById('kimi-tweaks');if(el)el.style.display='none'}});
try{window.parent.postMessage({type:'__edit_mode_available'},'*')}catch(_){}
</script>
