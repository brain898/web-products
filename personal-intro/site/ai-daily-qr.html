<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报群 — 叶文哲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400&family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kimi-shared.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
.qr-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 80px;position:relative;z-index:2}

.back-link{position:fixed;top:32px;left:32px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border:1px solid var(--border);border-radius:24px;color:var(--text-mute);text-decoration:none;font-family:'Inter',sans-serif;font-size:12px;background:rgba(20,16,48,0.55);backdrop-filter:blur(8px);transition:all 0.3s;z-index:10;letter-spacing:0.02em}
.back-link:hover{border-color:var(--border-hover);color:var(--accent)}

.head{text-align:center;margin-bottom:36px;opacity:0;animation:fadeUp 0.8s ease forwards 0.1s}
.head .ja{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--accent);letter-spacing:0.05em;margin-bottom:8px;font-weight:300}
.head h1{font-family:'Noto Serif SC',serif;font-size:clamp(32px,5vw,56px);font-weight:300;letter-spacing:0.04em;line-height:1.1;margin-bottom:14px}
.head h1 .dot{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:50%;margin-left:6px;vertical-align:0.4em;box-shadow:0 0 16px var(--accent)}
.head .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--text-mute);letter-spacing:0.05em;font-weight:300}

.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:24px;padding:44px 44px 36px;max-width:440px;width:100%;text-align:center;opacity:0;animation:fadeUp 0.9s ease forwards 0.25s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.6}
.card::after{content:"";position:absolute;left:50%;top:50%;width:160%;height:160%;transform:translate(-50%,-50%);background:radial-gradient(circle at center,rgba(255,140,140,0.10),transparent 50%);pointer-events:none}

.card-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--accent);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:14px;font-weight:400;position:relative;z-index:1}
.card h2{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:400;letter-spacing:0.03em;line-height:1.4;margin-bottom:10px;position:relative;z-index:1}
.card .desc{font-family:'Noto Sans SC',sans-serif;font-size:13.5px;color:var(--text-mute);line-height:1.85;font-weight:300;margin-bottom:32px;position:relative;z-index:1}

.qr-wrap{background:#fff;border-radius:18px;padding:18px;display:inline-block;margin-bottom:28px;position:relative;z-index:1;box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 24px 48px -12px rgba(0,0,0,0.5),0 0 60px -10px var(--thread)}
.qr-wrap::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;border-radius:19px;padding:1px;background:linear-gradient(135deg,var(--accent),transparent 40%,transparent 60%,var(--accent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0.3;pointer-events:none}
.qr-wrap img{max-width:200px;width:100%;height:auto;display:block;border-radius:6px}

.hint-row{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Noto Sans SC',sans-serif;font-size:12.5px;color:var(--text-soft);font-weight:300;position:relative;z-index:1;letter-spacing:0.02em}
.hint-row strong{color:var(--text-mute);font-weight:400}
.hint-row .pulse{width:6px;height:6px;border-radius:50%;background:#86d99e;box-shadow:0 0 10px #86d99e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.meta{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fadeUp 0.8s ease forwards 0.5s}
.meta .row{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-soft);letter-spacing:0.1em;text-transform:uppercase}
.meta .quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--text-mute);letter-spacing:0.04em;max-width:380px;text-align:center;line-height:1.6;margin-top:6px}

@media(max-width:480px){
  .card{padding:32px 28px 28px}
  .qr-wrap{padding:14px}
  .qr-wrap img{max-width:180px}
  .back-link{top:18px;left:18px}
}
</style>
</head>
<body>
<script>(function(){var s=localStorage.getItem('kimiPalette');if(s)window.__KIMI_PALETTE__=s;})();</script>
<script src="kimi-no-na-wa.js"></script>

<a class="back-link" href="works.html">← 返回作品集</a>

<div class="qr-page">
  <div class="head">
    <h1>每日 AI 日报<span class="dot"></span></h1>
    <div class="en">Daily AI News · Auto-curated</div>
  </div>

  <div class="card">
    <div class="card-label">Join the Group</div>
    <h2>扫码加入 AI 日报群</h2>
    <p class="desc">每天早上自动推送 AI 领域最新动态，<br>不用刷 Twitter 也能掌握前沿进展。</p>
    <div class="qr-wrap">
      <img src="logos/ai-daily-qr.jpg" alt="AI 日报群二维码">
    </div>
    <div class="hint-row"><span class="pulse"></span><strong>微信扫码</strong> · 每天早上 8:00 准时推送</div>
  </div>

  <div class="meta">
    <div class="row">Built with Claude Code · Auto-published</div>
    <div class="quote">「不用刷 Twitter，也能赶上 AI 的脚步。」</div>
  </div>
</div>

<script src="kimi-tweaks.js"></script>
</body>
</html>
